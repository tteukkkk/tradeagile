{% extends 'base.html' %}

{% block content %}
    <h2>Confirmar Exclusão</h2>

    <div style="background-color: #fff3cd; padding: 15px; border-left: 5px solid #ffeeba; margin-bottom: 20px;">
        <strong>Atenção!</strong> Excluir esta categoria apagará <strong> todos os produtos</strong> vinculados a ela!
    </div>

    <p>Você tem certeza de que deseja excluir a categoria <strong>{{ categoria.nome }}"</strong>?</p>

    <p>Esta ação não pode ser desfeita.</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'categoria_listar' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
