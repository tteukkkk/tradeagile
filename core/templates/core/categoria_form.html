{% extends 'base.html' %}

{% block content %}
    <h2>{{ acoes }} Categoria</h2>

    <form method="post" style="max-width: 600px; margin-top: 20px;">
        {% csrf_token %}
        
        <label for="{{ form.nome.id_for_label }}">Nome da Categoria:</label>
        {{ form.nome }}

        <label for="{{ form.descricao.id_for_label }}">Descrição:</label>
        {{ form.descricao }}

        <div style="margin-top: 20px;">
            <button type="submit" class="btn">Salvar Categoria</button>
            <a href="{% url 'categoria_listar' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
{% endblock %}
